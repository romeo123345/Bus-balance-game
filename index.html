</style></head><body><div id="game"></div><div id="hud" class="panel"><h1>BUS BALANCE / 3D</h1><div class="small">생존 시간</div><div id="time" class="big">0.0초</div><div class="small">균형 위험도</div><div class="meter"><div id="fill"></div></div><div id="risk" class="small" style="margin-top:5px">안정적</div></div><div id="help" class="panel"><b>조작법</b><br><kbd>A</kbd> <kbd>D</kbd> 좌우 버티기<br><kbd>W</kbd> <kbd>S</kbd> 앞뒤 버티기<br><kbd>Space</kbd> 다시 일어나기<br><kbd>R</kbd> 재시작</div><div id="bottom" class="panel"><b id="status">버스가 출발합니다. 중심을 잡으세요!</b><div class="small">급출발 · 급정거 · 코너를 버텨라</div><button id="start">게임 시작</button><button id="restart" class="secondary">다시 시작</button></div><div id="overlay"><div id="dialog"><div class="eyebrow">A SMALL 3D PHYSICS-COMEDY PROTOTYPE</div><h2>버스에서<br>넘어지지 마시오.</h2><p>도시 버스 안에서 급출발과 급회전을 버티세요. A/D와 W/S로 몸의 중심을 반대로 이동해 균형을 잡습니다.</p><p class="small">PC 키보드 조작 · 3D 장면 · 프로토타입 버전</p><button id="board">탑승하기</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc7d8);scene.fog=new THREE.Fog(0x9dc7d8,22,80);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,3.5,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe7f7ff,0x56616a,2));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-5,10,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M={};function material(n,c,r=.8,m=0){return M[n]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}material('floor',0x35424b);material('seat',0x176b76);material('seat2',0x21848a);material('yellow',0xf3c84b);material('metal',0xb5c6cc,.35,.6);material('dark',0x47545c,.4,.4);material('glass',0x77b5ca,.24);material('body',0xe8ecea);material('skin',0xe8b58b);material('shirt',0xe36b46);material('pants',0x26384c);material('shoe',0x20252b);material('road',0x444c52);material('b1',0xb6a99a);material('b2',0xd1d5d1);material('b3',0x8299a3);material('win',0x8ebbc7,.4);
function box(p,w,h,d,n,x,y,z,cast=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M[n]);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;p.add(o);return o}function cyl(p,r,h,n,x,y,z){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10),M[n]);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}
const bus=new THREE.Group();scene.add(bus);box(bus,5.4,.18,15,'floor',0,.2,0);box(bus,5.4,.16,15,'dark',0,.08,0,false);box(bus,.18,1.25,15,'body',-2.62,.92,0);box(bus,.18,1.25,15,'body',2.62,.92,0);box(bus,5.35,.2,.18,'body',0,1.55,-7.42);box(bus,5.35,.2,.18,'body',0,1.55,7.42);
for(let s of [-1,1])for(let i=0;i<6;i++){let z=-5.7+i*2.05;box(bus,.035,1.5,1.88,'glass',s*2.51,2.35,z,false);box(bus,.12,1.65,.08,'body',s*2.57,2.35,z-.98);box(bus,.12,1.65,.08,'body',s*2.57,2.35,z+.98)}
for(let z=-5.5;z<5.5;z+=2.15)for(let s of [-1,1]){let x=s*1.65;box(bus,.92,.22,1,'seat',x,.62,z);box(bus,.92,1.05,.2,'seat2',x,1.12,z+.42);for(let dx of [-.36,.36])box(bus,.1,.36,.92,'seat2',x+dx,.86,z)}box(bus,3.7,.65,.45,'dark',0,.8,-6.6);box(bus,1.2,.12,.5,'yellow',0,1.22,-6.55);
for(let x of [-1.9,-.65,.65,1.9]){cyl(bus,.045,2.4,'yellow',x,2.2,0);cyl(bus,.04,5.1,'yellow',x,3.35,0)}for(let z=-5.2;z<5.4;z+=2.55){cyl(bus,.035,3.75,'yellow',0,3.42,z);box(bus,4,.07,.07,'yellow',0,3.55,z,false)}box(bus,.09,2.65,.12,'yellow',-2.45,1.65,5.65);box(bus,.09,2.65,.12,'yellow',-1.1,1.65,5.65);box(bus,1.45,.09,.12,'yellow',-1.78,2.98,5.65);
const city=new THREE.Group();scene.add(city);for(let s of [-1,1])for(let i=0;i<24;i++){let z=-50+i*4.3,h=2.8+(i*7%8)*.45,w=1.5+(i*3%4)*.4,x=s*(5.1+(i%3)*.45);box(city,w,h,2.4,['b1','b2','b3'][i%3],x,h/2-.1,z,false);for(let y=.7;y<h-.3;y+=.8)for(let xx=-w/2+.25;xx<w/2-.1;xx+=.45)box(city,.18,.25,.025,'win',x+xx,y,z+1.22,false)}box(scene,100,.1,150,'road',0,-.25,-20,false);for(let z=-80;z<50;z+=7)box(scene,.14,.012,3,'yellow',0,-.18,z,false);
const player=new THREE.Group();scene.add(player);const torso=new THREE.Group();player.add(torso);box(torso,.62,.78,.32,'shirt',0,1.25,0);let head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),M.skin);head.position.set(0,1.82,0);head.castShadow=true;torso.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.245,12,8,0,Math.PI*2,0,Math.PI*.55),M.pants);hair.position.set(0,1.91,-.015);torso.add(hair);for(let x of [-.13,.13]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.025,8,6),M.shoe);eye.position.set(x,1.84,.22);torso.add(eye)}cyl(torso,.09,.15,'skin',0,1.68,0);for(let x of [-.17,.17]){box(player,.18,.68,.2,'pants',x,.46,0);box(player,.22,.12,.34,'shoe',x,.12,.06)}const arms=[];for(let x of [-.4,.4]){let a=box(torso,.16,.66,.17,'shirt',x,1.28,0);arms.push(a);cyl(torso,.075,.13,'skin',x,.92,.02)}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')reset();if(e.code==='Space'&&fallen)recover()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let running=false,fallen=false,elapsed=0,tx=0,tz=0,vx=0,vz=0,eventTimer=1.8,eventType=0,strength=0,fallTime=0,shake=0;const $=id=>document.getElementById(id);function start(){running=true;$('overlay').style.display='none';$('status').textContent='버스가 움직입니다. 중심을 잡으세요!'}function reset(){running=true;fallen=false;elapsed=0;tx=tz=vx=vz=fallTime=shake=0;eventTimer=1.4;player.position.set(0,.3,2.5);player.rotation.set(0,0,0);torso.rotation.set(0,0,0);$('overlay').style.display='none';$('status').textContent='다시 출발합니다!'}function recover(){fallen=false;tx=tz=vx=vz=0;player.rotation.set(0,0,0);torso.rotation.set(0,0,0);player.position.set(0,.3,2.5);$('status').textContent='아슬아슬하게 일어났습니다!'}$('start').onclick=start;$('board').onclick=start;$('restart').onclick=reset;player.position.set(0,.3,2.5);const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(running&&!fallen){elapsed+=dt;eventTimer-=dt;if(eventTimer<=0){eventType=Math.floor(Math.random()*3);strength=(.65+Math.random()*.8)*(Math.random()<.2?1.55:1);eventTimer=1.7+Math.random()*2.2;shake=.3+strength*.5;$('status').textContent=['급출발! 뒤로 쏠립니다!','급정거! 앞으로 버티세요!','코너입니다! 몸을 기울이세요!'][eventType]}let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let ax=-ix*5.4,az=-iz*4.5;if(eventType===0)az+=strength*1.5;if(eventType===1)az-=strength*1.9;if(eventType===2)ax+=(Math.sin(elapsed*2.1)>0?1:-1)*strength*1.9;vx+=(ax-tx*2.2)*dt;vz+=(az-tz*2.2)*dt;vx*=Math.pow(.93,dt*60);vz*=Math.pow(.94,dt*60);tx=THREE.MathUtils.clamp(tx+vx*dt,-1.25,1.25);tz=THREE.MathUtils.clamp(tz+vz*dt,-1.1,1.1);player.position.x=THREE.MathUtils.clamp(tx*.72,-.9,.9);player.position.z=2.5+THREE.MathUtils.clamp(tz*.35,-.35,.35);player.rotation.z=-tx*.55;player.rotation.x=tz*.45;torso.rotation.z=-tx*.32;torso.rotation.x=tz*.3;arms[0].rotation.z=-.18-tx*.55;arms[1].rotation.z=.18-tx*.55;city.position.z=(elapsed*9)%4.3;bus.rotation.z=Math.sin(elapsed*1.4)*.012+tx*.015;bus.position.y=Math.sin(elapsed*7)*.025;shake=Math.max(0,shake-dt*1.4);if(Math.abs(tx)>1.04||Math.abs(tz)>.94){fallTime+=dt;if(fallTime>.45){fallen=true;running=false;$('status').textContent='쿵! 균형을 잃었습니다. Space로 다시 일어나거나 다시 시작하세요.'}}else fallTime=0}else if(fallen){player.rotation.z+=(tx>0?1:-1)*dt*1.4;player.rotation.x+=dt*.5;torso.rotation.z=player.rotation.z*.4;shake=Math.max(0,shake-dt)}let risk=Math.min(100,Math.sqrt(tx*tx+tz*tz)*68);$('time').textContent=elapsed.toFixed(1)+'초';$('fill').style.width=risk+'%';$('risk').textContent=risk<35?'안정적':risk<68?'위험! 중심을 잡으세요':'매우 위험!';$('risk').style.color=risk<35?'#b5e8ff':risk<68?'#ffd17b':'#ff7c7c';camera.position.x+=(player.position.x*.14-camera.position.x)*dt*2;camera.position.y=3.45+Math.sin(elapsed*7)*shake*.12;camera.lookAt(0,1.7,.2);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
